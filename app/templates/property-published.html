{% extends "authenticated-base.html" %}
{% block title %}Listing Published{% endblock %}

{% block subpage_content %}
<section class="property-success-card">
  <div class="property-success-icon">
    <span class="material-symbols-outlined" aria-hidden="true">check</span>
  </div>
  <h1>Listing Published!</h1>

</section>
{% endblock %}
